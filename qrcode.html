<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRcode maker | rusidevelops</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all .2s;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: rgb(0, 0, 0);
            color: white;
            font-family: sans-serif;
        }

        input::placeholder {
            user-select: none;
            color: #888;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border: 1px solid gray;
            padding: 30px 20px;
            width: 340px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        button {
            width: 60%;
            height: 35px;
            font-size: 16px;
            border-radius: 10px;
            background: black;
            color: white;
            user-select: none;
            border: 1px solid white;
            cursor: pointer;
        }

        button:hover {
            background: white;
            color: black;
        }

        input {
            width: 90%;
            height: 40px;
            padding: 0 10px;
            font-size: 15px;
            outline: none;
            background: black;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            transition: all .2s;
        }

        input:focus {
            outline: auto;
            outline-color: white;
        }

        button:focus {
            border: 2px solid white;
        }

        .hidden {
            display: none !important;
        }

        #customAlert {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .alert-box {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .alert-box button {
            background: black;
            color: white;
            margin: 0 auto;
        }

        #qrcode {
            position: absolute;
            left: -9999px;
        }
    </style>
</head>
<body>

    <div class="input-container">

        <input
            type="text"
            id="urlInput"
            placeholder="Type a url or text..."
        >

        <input
            type="text"
            id="nameInput"
            placeholder="Name of qrcode..."
        >

        <button id="showBtn">Download</button>

    </div>

    <!-- Hidden QR code -->
    <div id="qrcode"></div>

    <!-- Success popup -->
    <div id="customAlert" class="hidden">

        <div class="alert-box">

            <h2>Success!</h2>

            <p>Your QR code has been saved.</p>

            <button id="closeBtn">OK</button>

        </div>

    </div>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        const showBtn = document.getElementById("showBtn");
        const urlInput = document.getElementById("urlInput");
        const nameInput = document.getElementById("nameInput");

        const customAlert = document.getElementById("customAlert");
        const closeBtn = document.getElementById("closeBtn");

        const qrContainer = document.getElementById("qrcode");


        showBtn.addEventListener("click", () => {

            const url = urlInput.value.trim();
            let name = nameInput.value.trim();


            // Check inputs
            if (!url || !name) {

                alert("Please fill in both fields.");

                return;
            }


            // Remove invalid filename characters
            name = name.replace(/[<>:"/\\|?*]/g, "_");


            // Remove old QR code
            qrContainer.innerHTML = "";


            // Generate QR code
            new QRCode(qrContainer, {

                text: url,

                width: 500,
                height: 500,

                correctLevel: QRCode.CorrectLevel.H

            });


            // Wait for QR image to be generated
            setTimeout(() => {

                const canvas = qrContainer.querySelector("canvas");

                if (!canvas) {

                    alert("Could not generate QR code.");

                    return;
                }


                // Convert QR canvas to PNG
                canvas.toBlob((blob) => {

                    const download = document.createElement("a");

                    download.href = URL.createObjectURL(blob);

                    download.download = name + ".png";

                    download.click();

                    URL.revokeObjectURL(download.href);


                    // Show success popup
                    customAlert.classList.remove("hidden");

                }, "image/png");

            }, 100);

        });


        closeBtn.addEventListener("click", () => {

            customAlert.classList.add("hidden");

            urlInput.value = "";
            nameInput.value = "";

        });


    </script>

</body>
</html>
